apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: platform-team
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: eucavalcanti
spec:
  memberOf:
    - platform-team
---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: idp-lab
  description: Ambiente de laboratório do IDP
spec:
  owner: group:default/platform-team
---
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: provisioning-api
spec:
  type: openapi
  lifecycle: experimental
  owner: group:default/platform-team
  system: idp-lab
  definition: |
    openapi: 3.0.0
    info:
      title: Provisioning API
      version: 0.1.0
    paths:
      /provision:
        post:
          summary: Dispara terraform apply
          responses:
            "200": { description: started }
